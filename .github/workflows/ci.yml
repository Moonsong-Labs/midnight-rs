name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Trim debuginfo to line tables only. The bulk of a `cargo test` target dir is
  # dependency debuginfo (deps build under the dev profile, tests under test), so
  # shrinking both keeps panics' file:line while cutting disk use and link time.
  # CI-only; local builds keep full debuginfo.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # ---------- Compact sources ----------

  # The devnet contracts, the test and conformance fixtures, and the goldens
  # that the TS runtime derives from the corpus. None of them is committed.
  # The job also checks the interpreter's list of natives against the
  # compiler's native tables.
  compact:
    name: Compile the Compact sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # No npm cache: from a cache, `npm ci` installs the runtime that the
      # lockfile names, not the tarball that `make goldens` builds, and skips
      # its integrity check.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: make check-natives
      - run: make compile-contracts fixtures goldens
      # The artifact keeps each path below the repository root, and the
      # compact-outputs action puts it back there. It lives as long as GitHub
      # allows a re-run, because a re-run of a failed job downloads it again.
      # A re-run of this job replaces it. The fingerprint files go with it, so
      # the make targets of the other jobs find every output up to date.
      - uses: actions/upload-artifact@v6
        with:
          name: compact-outputs
          path: |
            devnet/contracts/*/compiled
            tests/conformance/fixtures/*/compiler
            tests/conformance/fixtures/*/contract
            tests/conformance/expected
            crates/midnight-contract/tests/fixtures/*/compiler
            tests/fixtures/compiled
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  # ---------- Lint ----------

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: make fmt-check

  workspace-inheritance:
    name: Workspace Inheritance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: RomarQ/cargo-workspace-inheritance-check@v1
        with:
          promotion-threshold: 1
          promotion-failure: true

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: [compact]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/compact-outputs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: make clippy

  doc:
    name: Docs
    # Rustdoc's lints are the only thing that catches a doc link to an item
    # that moved or was renamed, a public doc pointing at a private item, or a
    # bare URL. Neither `check` nor `clippy` runs them, so without this job
    # they accumulate silently.
    runs-on: ubuntu-latest
    needs: [compact]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/compact-outputs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make doc

  # ---------- Check + Test ----------

  check:
    name: Check
    runs-on: ubuntu-latest
    needs: [compact]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/compact-outputs
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make check

  # `make test` covers the conformance replay: the corpus is a workspace member,
  # so `cargo test --workspace` diffs the Rust IR interpreter against the
  # goldens that the compact job derived from the TS runtime.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [compact]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/compact-outputs
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make test

  macos:
    name: macOS check + unit tests
    # Contributors develop on macOS; this catches platform-specific breakage
    # (home_dir resolution, TLS backends, libsecp256k1 build flags) that the
    # Linux-only devnet e2e job never exercises. No devnet here: the node +
    # indexer stack is Linux Docker only.
    runs-on: macos-latest
    needs: [compact]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/compact-outputs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make check
      - run: make test

  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: make audit

  # ---------- E2E (devnet: node, indexer and proof server) ----------

  e2e:
    name: E2E tests (devnet, ledger ${{ matrix.ledger }})
    runs-on: ubuntu-latest
    needs: [check, compact]
    strategy:
      fail-fast: false
      matrix:
        ledger: [8, 9]
    # The Makefile's devnet targets pick the compose file from it.
    env:
      DEVNET_LEDGER: ${{ matrix.ledger }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/compact-outputs

      # rust-lld bus-errors on ubuntu-latest when target/ + container data fill
      # the runner's ~14 GB free disk (symptom: `collect2: fatal error: ld
      # terminated with signal 7 [Bus error]` during the example link step).
      - uses: ./.github/actions/free-disk-space

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache midnight-rs build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: midnight-rs

      # Link before the devnet starts: linking competes with the node and
      # indexer for the runner's memory and disk.
      - name: Pre-build e2e binaries
        run: |
          cargo test --workspace --no-run
          cargo build -p example-counter -p example-contract-maintenance -p example-private-state -p example-shielded-transfer -p example-wallet-sync -p example-combine-and-sponsor -p example-shielded-swap

      # --- Start devnet (node, indexer and proof server); waits until each is ready ---
      - name: Start devnet
        run: make dev-up

      # --- Run e2e tests (binaries already built above) ---
      - name: Run e2e tests
        run: make test-e2e

      - name: Run counter example
        run: make dev-settle run-counter

      - name: Run private-state example
        run: make dev-settle run-private-state

      - name: Run contract-maintenance example
        run: make dev-settle run-contract-maintenance

      - name: Run shielded-transfer example
        run: make dev-settle run-shielded-transfer

      # Two-wallet multi-party flows: merge_transactions (each pays own fees)
      # and balance_transaction (one wallet sponsors the other's fees). Funds
      # seed 2 from the genesis seed, so it needs the devnet fully up.
      - name: Run combine-and-sponsor example
        run: make dev-settle run-combine-and-sponsor

      # Native two-party token swap: each wallet builds one fee-less, unbalanced
      # half (shielded_swap), a sponsor merges the mirrored halves and pays the
      # merged swap's fees (balance_transaction). Also seeds the second wallet
      # with a minted token, so it needs the devnet fully up.
      - name: Run shielded-swap example
        run: make dev-settle run-shielded-swap

      # Last, because it restarts the node container out from under everything
      # else on this devnet.
      - name: Run the node-restart test
        run: make test-e2e-node-restart

      # Before dev-down, which removes the containers and their logs. A
      # restart clears docker's OOM flag, but the kernel log keeps a record of
      # each OOM kill.
      - name: Show devnet status
        if: failure()
        run: |
          make dev-status
          sudo dmesg --time-format iso | grep -i -E 'out of memory|killed process|oom-kill' || true

      - name: Stop devnet
        if: always()
        run: make dev-down
