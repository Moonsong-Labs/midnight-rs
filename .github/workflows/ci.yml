name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Trim debuginfo to line tables only. The bulk of a `cargo test` target dir is
  # dependency debuginfo (deps build under the dev profile, tests under test), so
  # shrinking both keeps panics' file:line while cutting disk use and link time.
  # CI-only; local builds keep full debuginfo.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # ---------- Lint ----------

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: make fmt-check

  workspace-inheritance:
    name: Workspace Inheritance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: RomarQ/cargo-workspace-inheritance-check@v1
        with:
          promotion-threshold: 1
          promotion-failure: true

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The ledger crates come from git, so this job fetches and caches roughly
      # a gigabyte of checkouts on top of its build.
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: make clippy

  doc:
    name: Docs
    # Rustdoc's lints are the only thing that catches a doc link to an item
    # that moved or was renamed, a public doc pointing at a private item, or a
    # bare URL. Neither `check` nor `clippy` runs them, so without this job
    # they accumulate silently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make doc

  # ---------- Check + Test ----------

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make check

  # `make test` covers the conformance replay: the corpus is a workspace member,
  # so `cargo test --workspace` diffs the Rust IR interpreter against the
  # committed goldens. Re-deriving those goldens from the TS runtime needs the
  # compiler, so the codegen-drift workflow does it on its own schedule.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make test


  macos:
    name: macOS check + unit tests
    # Contributors develop on macOS; this catches platform-specific breakage
    # (home_dir resolution, TLS backends, libsecp256k1 build flags) that the
    # Linux-only devnet e2e job never exercises. No devnet here: the node +
    # indexer stack is Linux Docker only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make check
      - run: make test

  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    # `rustsec/audit-check` annotates findings via the Checks API. Default
    # GITHUB_TOKEN permissions on push-to-main don't include `checks: write`,
    # which made the action fail with "Resource not accessible by integration"
    # rather than report the underlying advisories.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------- E2E (devnet: node + indexer) ----------

  e2e:
    name: E2E tests (devnet)
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4

      # rust-lld bus-errors on ubuntu-latest when target/ + container data fill
      # the runner's ~14 GB free disk (symptom: `collect2: fatal error: ld
      # terminated with signal 7 [Bus error]` during the example link step).
      - uses: ./.github/actions/free-disk-space

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache midnight-rs build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: midnight-rs

      # Link before the devnet starts: linking competes with the node and
      # indexer for the runner's memory and disk.
      - name: Pre-build e2e binaries
        run: |
          cargo test --workspace --no-run
          cargo build -p example-counter -p example-contract-maintenance -p example-private-state -p example-shielded-transfer -p example-wallet-sync -p example-combine-and-sponsor -p example-shielded-swap

      # --- Start devnet (node + indexer); waits until both are ready ---
      - name: Start devnet
        run: make dev-up

      # --- Run e2e tests (binaries already built above) ---
      - name: Run e2e tests
        run: make test-e2e

      - name: Run counter example
        run: make dev-settle run-counter

      - name: Run private-state example
        run: make dev-settle run-private-state

      - name: Run contract-maintenance example
        run: make dev-settle run-contract-maintenance

      - name: Run shielded-transfer example
        run: make dev-settle run-shielded-transfer

      # Two-wallet multi-party flows: merge_transactions (each pays own fees)
      # and balance_transaction (one wallet sponsors the other's fees). Funds
      # seed 2 from the genesis seed, so it needs the devnet fully up.
      - name: Run combine-and-sponsor example
        run: make dev-settle run-combine-and-sponsor

      # Native two-party token swap: each wallet builds one fee-less, unbalanced
      # half (shielded_swap), a sponsor merges the mirrored halves and pays the
      # merged swap's fees (balance_transaction). Also seeds the second wallet
      # with a minted token, so it needs the devnet fully up.
      - name: Run shielded-swap example
        run: make dev-settle run-shielded-swap

      # Last, because it restarts the node container out from under everything
      # else on this devnet.
      - name: Run the node-restart test
        run: make test-e2e-node-restart

      - name: Stop devnet
        if: always()
        run: make dev-down
