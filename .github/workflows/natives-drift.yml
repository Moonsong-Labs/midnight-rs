name: Natives drift

# The interpreter's native check reads crates/compact/interpreter/src/compact-natives.txt,
# the runtime symbols of the compiler's native tables at COMPACT_REV. The file
# is committed, so that the unit tests compile without a network fetch. This
# job fetches the tables again and fails when the file no longer matches them.
# It runs nightly and on a change to the Makefile or the file.
#
# The CI workflow builds the devnet contracts, the test and conformance
# fixtures, and the goldens from source on each run, so none of them can drift.
# The parser fixtures of crates/compact/analyzed-ir stay pinned to one compiler
# version on purpose.

on:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'Makefile'
      - 'crates/compact/interpreter/src/compact-natives.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  natives-drift:
    name: Committed natives match the pinned compiler
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the compiler's native names
        run: make compact-natives

      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- crates/compact/interpreter/src/compact-natives.txt; then
            echo
            echo "compact-natives.txt no longer matches the compiler at COMPACT_REV."
            echo "Run 'make compact-natives' and commit what changes."
            exit 1
          fi
