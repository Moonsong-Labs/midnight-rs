name: Codegen drift

# The fixtures carry the analyzed IR that `cargo test` reads, and the corpus
# carries goldens the TS runtime produced. Both are committed. Neither is
# checked against the compiler that is supposed to have written them.
#
# That is how #192 happened: #162 regenerated every `analyzed-ir.sexp` and left
# the generated JavaScript alone, and the pair only came apart months later,
# when someone tried to add a fixture.
#
# This job holds the whole chain honest. It runs the compactc at COMPACT_REV,
# builds the runtime the driver installs, recompiles the fixtures, re-derives
# the goldens through the TS driver, and fails on any difference from what is
# committed. It is also what lets the codegen and the runtime tarball stay out
# of the repository: nothing else re-derives them.
#
# compactc runs in COMPACTC_IMAGE (see the Makefile), and Nix builds only the
# runtime. The job runs nightly and on a change to the Makefile, the driver or
# the goldens, rather than on every pull request.
#
# The devnet contracts stay out of it. `make compile-contracts` also generates
# proving keys, which the fixture targets skip with `--skip-zk`, and that is the
# slow part of a contract build.

on:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'Makefile'
      - 'tests/conformance/fixtures/**'
      - 'tests/conformance/expected/**'
      - 'tests/conformance/ts-driver/**'
      - 'tests/conformance/package.json'
      - 'crates/midnight-contract/tests/fixtures/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codegen-drift:
    name: Committed codegen matches the pinned compiler
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          # The fork's flake declares this substituter, and the dependencies
          # of the runtime build come from there.
          extra_nix_config: |
            extra-substituters = https://cache.iog.io
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            accept-flake-config = true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/conformance/package-lock.json

      - name: Build the runtime the driver installs
        run: make vendor-compact-runtime

      - name: Recompile the fixtures
        run: |
          make regen-conformance-fixtures
          make regen-test-fixtures

      - name: Re-derive the goldens through the TS runtime
        run: make conformance-regen

      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- \
              tests/conformance/fixtures \
              tests/conformance/expected \
              crates/midnight-contract/tests/fixtures; then
            echo
            echo "The committed artifacts no longer match the compiler at COMPACT_REV."
            echo "Run 'make vendor-compact-runtime regen-conformance-fixtures regen-test-fixtures"
            echo "conformance-regen' and commit what changes."
            exit 1
          fi
