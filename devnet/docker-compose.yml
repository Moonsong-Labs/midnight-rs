services:
  node:
    container_name: midnight-example-node
    image: "midnightntwrk/midnight-node:2.1.101-rc.2"
    ports:
      - "9944:9944"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9944/health"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      CFG_PRESET: "dev"

  indexer:
    container_name: midnight-example-indexer
    image: "ghcr.io/midnightntwrk/indexer-standalone:4.4.101"
    # On a brand-new chain the indexer can exit before the node has block 1.
    restart: on-failure
    ports:
      - "8088:8088"
    environment:
      RUST_LOG: "info"
      APP__INFRA__SECRET: "303132333435363738393031323334353637383930313233343536373839303132"
      APP__INFRA__NODE__URL: "ws://node:9944"
      # Indexer 4.4 requires its SPO indexing settings. The dev chain has no
      # stake pools, so any Blockfrost id serves.
      APP__INFRA__SPO_NODE__URL: "ws://node:9944"
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: "unused-on-a-dev-chain"
    depends_on:
      node:
        condition: service_healthy

  proof-server:
    container_name: midnight-example-proof-server
    # The proof server of the ledger release that the SDK links.
    image: "midnightntwrk/proof-server:9.0.1"
    ports:
      - "6300:6300"
