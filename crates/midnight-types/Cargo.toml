[package]
name = "midnight-types"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Implementation-free vocabulary and toolkit for the Midnight SDK: network and address model, balances, transfer building, errors"

[features]
ledger-8 = ["midnight-helpers/ledger-8"]

[dependencies]
async-trait = { workspace = true }
midnight-helpers = { workspace = true }
midnight-indexer-client = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
