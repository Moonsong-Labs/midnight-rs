[package]
name = "midnight-provider"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Provider trait and MidnightProvider for Midnight network interaction"

[dependencies]
# midnight-typed-state, not compact-bindgen, to avoid a cycle: compact-bindgen
# re-exports midnight-contract, which transitively depends on midnight-provider.
midnight-typed-state = { workspace = true }
midnight-types = { workspace = true }
midnight-wallet-facade = { workspace = true }
midnight-private-state = { workspace = true }
midnight-helpers = { workspace = true }
midnight-zkir-v3 = { workspace = true }
subxt = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# The devnet tests sync a real wallet with `midnight-wallet`; the library
# itself never names the implementation.
midnight-wallet = { workspace = true }
# `test-util`: the shared mock indexer server (`testutil`).
midnight-indexer-client = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }
