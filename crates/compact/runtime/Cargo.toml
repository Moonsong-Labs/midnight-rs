version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
ledger-8 = ["midnight-helpers/ledger-8", "midnight-typed-state/ledger-8"]

[dependencies]
midnight-helpers = { workspace = true }
num-bigint = { workspace = true }
midnight-typed-state = { workspace = true }
midnight-base-crypto = { workspace = true }
compact-codegen = { workspace = true }
thiserror = { workspace = true }
