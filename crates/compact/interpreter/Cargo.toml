[package]
name = "compact-interpreter"
description = "Tree-walking interpreter for the Compact circuit-body IR (executes circuits off-chain against contract state)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
ledger-9 = ["midnight-types/ledger-9", "compact-runtime/ledger-9", "midnight-typed-state/ledger-9"]

[dependencies]
midnight-types = { workspace = true }
num-bigint = { workspace = true }
compact-codegen = { workspace = true }
compact-runtime = { workspace = true }
midnight-typed-state = { workspace = true }
midnight-base-crypto = { workspace = true }
hex = { workspace = true }
