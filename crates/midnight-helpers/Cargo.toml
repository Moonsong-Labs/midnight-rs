[package]
name = "midnight-helpers"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Facade over the midnight-node ledger helpers, one module per ledger generation. Internal use only: workspace crates import `midnight_helpers` instead of the upstream helpers so the source is pinned in one place."

[dependencies]
midnight-node-ledger-helpers = { workspace = true }
midnight-ledger-unsafe-helpers = { workspace = true }
