# Generated-generation shim: no source of its own.
#
# `compact-interpreter`'s source, compiled against ledger 9. Cargo does not
# unify features across distinct packages, so this and its sibling both
# appear in one dependency graph. Normal dependencies only: a
# dev-dependency would pull the workspace's test-only cycles in here.
[package]
name = "compact-interpreter-v9"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "compact-interpreter compiled against ledger 9."

[lib]
# No explicit lib name: it would collide with the package this mirrors
# when both are built together. A dependent gets the name it wants from
# the `package = ` rename on its dependency key.
path = "../compact/interpreter/src/lib.rs"
# The interpreter's suite includes a check against the Compact compiler's
# native list, which reads a path relative to the manifest directory and so
# resolves differently here than in the package it mirrors. The interpreter
# holds no generation-dependent behaviour, so nothing is lost by leaving its
# tests to that package.
test = false
doctest = false
# Shares a lib name with the package it mirrors, so only one may be documented.
doc = false

[features]
# Inert. The generation comes from the `ledger_9` cfg a build script sets,
# so this only absorbs a request that feature unification forwards here.
ledger-9 = []
default = []

[dependencies]
midnight-types = { package = "midnight-types-v9", path = "../midnight-types-v9" }
num-bigint = { workspace = true }
compact-codegen = { workspace = true }
compact-runtime = { package = "compact-runtime-v9", path = "../compact-runtime-v9" }
midnight-typed-state = { package = "midnight-typed-state-v9", path = "../midnight-typed-state-v9" }
midnight-base-crypto = { workspace = true }
hex = { workspace = true }
