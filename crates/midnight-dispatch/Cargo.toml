[package]
name = "midnight-dispatch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Picks the ledger generation from the chain a client connects to, and speaks to it through one API."

[dependencies]
p8 = { package = "midnight-provider-v8", path = "../midnight-provider-v8" }
p9 = { package = "midnight-provider-v9", path = "../midnight-provider-v9" }
c8 = { package = "midnight-contract-v8", path = "../midnight-contract-v8" }
c9 = { package = "midnight-contract-v9", path = "../midnight-contract-v9" }
i8_ = { package = "compact-interpreter-v8", path = "../compact-interpreter-v8" }
i9 = { package = "compact-interpreter-v9", path = "../compact-interpreter-v9" }
midnight-base-crypto = { workspace = true }
compact-codegen = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
