[advisories]
ignore = [
    # ruzstd comes only through subxt's `light-client` feature
    # (subxt-lightclient -> smoldot-light -> smoldot -> ruzstd). No workspace
    # member enables that feature, so the crate is never compiled, but
    # Cargo.lock lists every optional dependency, and cargo audit reads it.
    # The fix is ruzstd 0.9.1, which no smoldot release requires. Remove this
    # entry when a subxt release depends on a smoldot that does.
    "RUSTSEC-2026-0344",
    # crypto-bigint 0.5.5 comes from elliptic-curve 0.13, which
    # midnight-curves, the ledger fork and bip32 0.5 require. The fix is in
    # crypto-bigint 0.7.6, which only elliptic-curve 0.14 uses. Remove this
    # entry when no crate depends on elliptic-curve 0.13.
    "RUSTSEC-2026-0387",
]
