[workspace]
resolver = "2"
members = [
    "crates/midnight-contract",
    "crates/midnight-provider",
    "crates/midnight-indexer-client",
    "crates/midnight-core",
    "crates/midnight-crypto",
    "crates/midnight-private-state",
    "crates/midnight-wallet",
    "crates/midnight-wallet-facade",
    "crates/midnight-types",
    "crates/midnight-helpers",
    "crates/compact/codegen",
    "crates/compact/analyzed-ir",
    "crates/compact/interpreter",
    "crates/compact/bindgen",
    "crates/compact/bindgen-macro",
    "crates/midnight-typed-state",
    "crates/compact/runtime",
    "examples/*",
    "tests/integration",
    "tests/conformance",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
# Internal crates
midnight-indexer-client = { path = "crates/midnight-indexer-client" }
midnight-provider = { path = "crates/midnight-provider" }
midnight-contract = { path = "crates/midnight-contract" }
midnight-core = { path = "crates/midnight-core" }
midnight-crypto = { path = "crates/midnight-crypto" }
midnight-private-state = { path = "crates/midnight-private-state" }
midnight-wallet = { path = "crates/midnight-wallet" }
midnight-wallet-facade = { path = "crates/midnight-wallet-facade" }
midnight-types = { path = "crates/midnight-types" }
midnight-helpers = { path = "crates/midnight-helpers" }

# Compact (code generation for Compact smart contracts)
compact-codegen = { path = "crates/compact/codegen" }
compact-analyzed-ir = { path = "crates/compact/analyzed-ir" }
compact-interpreter = { path = "crates/compact/interpreter" }
compact-bindgen = { path = "crates/compact/bindgen" }
compact-bindgen-macro = { path = "crates/compact/bindgen-macro" }
midnight-typed-state = { path = "crates/midnight-typed-state" }
compact-runtime = { path = "crates/compact/runtime" }

# External
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
sha2 = "0.10"
sha3 = "0.11"
hex = "0.4"
# H256: the block-hash type, the same crate subxt re-exports it from.
primitive-types = "0.13"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-util = "0.7"
futures-util = "0.3"
# Mirrors subxt 0.50's default feature set (jsonrpsee, native), made explicit
# to guard against upstream default drift, plus the auto-reconnecting websocket
# client the provider's node connection is built on. Re-derive the default part
# of this list from upstream's defaults on every subxt version bump: with
# default-features off, a new default feature an upgrade relies on would
# otherwise be dropped silently.
subxt = { version = "0.50", default-features = false, features = ["jsonrpsee", "native", "reconnecting-rpc-client"] }
sp-storage = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2603", default-features = false, features = ["std"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
prettyplease = "0.2"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
tempfile = "3"
trybuild = "1"
bip32 = "0.5"
bip39 = { version = "2.2.2", features = ["rand"] }
zeroize = { version = "1", features = ["derive"] }

# midnight-ledger ecosystem: ledger 8 and ledger 9 link side by side.
#
# Ledger 8 ships on crates.io. Ledger 9 ships only as git tags, so the
# `[patch.crates-io]` table at the end of this manifest points each of its
# crates at one. The two generations share the crates listed under "Shared":
# a single instance serves both, so `AlignedValue`, `HashOutput`, `Sp` and the
# tagged codec are one Rust type across them.
#
# Pinning policy: every midnight-* crate declared in this manifest is pinned
# with `=` because they ship as one ABI-coupled release set (serialization
# formats and proof artifacts must match across the group). Bump them together,
# deliberately, never by regenerating the lockfile. A pin must equal the
# version the patch table supplies, or Cargo keeps a second registry copy next
# to the git one. Transitive midnight-* crates (zswap, zkir, circuits, ...)
# still float on upstream caret requirements and are held only by Cargo.lock.
#
# The Compact side (interpreter, runtime, typed state, generated bindings)
# binds to ledger 9's on-chain runtime. The Impact ops and the state encoding
# are the same in both generations, so its values reach a ledger 8 chain by
# re-encoding.
midnight-onchain-runtime = { version = "=4.0.0" }
midnight-onchain-state = { version = "=4.0.0" }
midnight-transient-crypto = { version = "=3.0.0" }
midnight-coin-structure = { version = "=3.0.0" }
midnight-curves = { version = "=0.3.1" }
# Ledger 8's state types, to read state a ledger 8 chain wrote.
midnight-onchain-state-ledger-8 = { package = "midnight-onchain-state", version = "=3.0.1" }
midnight-coin-structure-ledger-8 = { package = "midnight-coin-structure", version = "=2.0.2" }
# Shared
midnight-serialize = { version = "=1.2.0" }
midnight-base-crypto = { version = "=1.1.0" }
midnight-storage = { version = "=2.0.4" }

# The ledger helpers of midnight-node: `midnight-node-ledger-helpers` carries
# the per-generation type surface, `midnight-ledger-unsafe-helpers` the
# transaction and wallet builders. Both expose a `ledger_8` and a `ledger_9`
# module. The tag must be one whose ledger 9 set matches the patch table.
midnight-node-ledger-helpers = { git = "https://github.com/midnightntwrk/midnight-node.git", tag = "toolkit-2.1.0-rc.3" }
midnight-ledger-unsafe-helpers = { git = "https://github.com/midnightntwrk/midnight-node.git", tag = "toolkit-2.1.0-rc.3" }

# Ledger 9 ships only as git tags. Each entry pins one crate to its per-crate
# release tag of the `ledger-9.1.0.0-rc.5` set, the set the helpers tag above
# builds against. Per-crate tags rather than the one workspace tag: their
# manifests name siblings by version, not by `path`, so each crate resolves
# through this table. The `-old` key supplies the 2.x `transient-crypto` that
# ledger 8 and the ledger 9 crates' legacy verifier keys both use.
[patch.crates-io]
midnight-ledger-v9 = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "crate-ledger-9.1.0.0-rc.5" }
midnight-ledger-static = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "crate-ledger-9.1.0.0-rc.5" }
midnight-zswap = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "zswap-9.0.0-rc.5" }
midnight-coin-structure = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "coin-structure-3.0.0-rc.2" }
midnight-base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "base-crypto-1.1.0-rc.3" }
midnight-base-crypto-derive = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "base-crypto-derive-1.1.0-rc.2" }
midnight-transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "transient-crypto-3.0.0-rc.3" }
midnight-transient-crypto-old = { package = "midnight-transient-crypto", git = "https://github.com/midnightntwrk/midnight-ledger", tag = "transient-crypto-2.2.0-rc.1" }
midnight-onchain-vm = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "onchain-vm-4.0.0-rc.3" }
midnight-onchain-state = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "onchain-state-4.0.0-rc.4" }
midnight-onchain-runtime = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "onchain-runtime-4.0.0-rc.4" }
midnight-zkir = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "zkir-2.2.0-rc.4" }
midnight-zkir-v3 = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "zkir-v3-3.0.0-rc.1" }
midnight-serialize = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "serialize-1.2.0-rc.2" }
midnight-storage = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "storage-2.0.4-rc.1" }
midnight-storage-core = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "storage-core-1.2.2-rc.1" }
