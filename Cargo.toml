[workspace]
resolver = "2"
members = [
    "crates/midnight-contract",
    "crates/midnight-provider",
    "crates/midnight-indexer-client",
    "crates/midnight-core",
    "crates/midnight-crypto",
    "crates/midnight-private-state",
    "crates/midnight-owner-only",
    "crates/midnight-wallet",
    "crates/midnight-wallet-facade",
    "crates/midnight-types",
    "crates/midnight-helpers",
    "crates/compact/codegen",
    "crates/compact/analyzed-ir",
    "crates/compact/interpreter",
    "crates/compact/bindgen",
    "crates/compact/bindgen-macro",
    "crates/midnight-typed-state",
    "crates/compact/runtime",
    "examples/*",
    "tests/integration",
    "tests/conformance",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
# Internal crates
midnight-indexer-client = { path = "crates/midnight-indexer-client" }
midnight-provider = { path = "crates/midnight-provider" }
midnight-contract = { path = "crates/midnight-contract" }
midnight-core = { path = "crates/midnight-core" }
midnight-crypto = { path = "crates/midnight-crypto" }
midnight-private-state = { path = "crates/midnight-private-state" }
midnight-owner-only = { path = "crates/midnight-owner-only" }
midnight-wallet = { path = "crates/midnight-wallet" }
midnight-wallet-facade = { path = "crates/midnight-wallet-facade" }
midnight-types = { path = "crates/midnight-types" }
midnight-helpers = { path = "crates/midnight-helpers" }

# Compact (code generation for Compact smart contracts)
compact-codegen = { path = "crates/compact/codegen" }
compact-analyzed-ir = { path = "crates/compact/analyzed-ir" }
compact-interpreter = { path = "crates/compact/interpreter" }
compact-bindgen = { path = "crates/compact/bindgen" }
compact-bindgen-macro = { path = "crates/compact/bindgen-macro" }
midnight-typed-state = { path = "crates/midnight-typed-state" }
compact-runtime = { path = "crates/compact/runtime" }

# External
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
sha2 = "0.10"
sha3 = "0.11"
hex = "0.4"
libc = "0.2"
# H256: the block-hash type, the same crate subxt re-exports it from.
primitive-types = "0.13"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
# Mirrors subxt 0.50's default feature set (jsonrpsee, native), made explicit
# to guard against upstream default drift, plus the auto-reconnecting websocket
# client the provider's node connection is built on. Re-derive the default part
# of this list from upstream's defaults on every subxt version bump: with
# default-features off, a new default feature an upgrade relies on would
# otherwise be dropped silently.
subxt = { version = "0.50", default-features = false, features = ["jsonrpsee", "native", "reconnecting-rpc-client"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
prettyplease = "0.2"
rand = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
tempfile = "3"
trybuild = "1"
bip32 = "0.5"
bip39 = { version = "2.2.2", features = ["rand"] }
zeroize = { version = "1", features = ["derive"] }

# midnight-ledger ecosystem: ledger 8 and ledger 9 link side by side.
#
# Every ledger crate comes from the RomarQ/midnight-ledger fork by revision.
# Upstream's ledger 9 crates name each other by crates.io version, where they
# are not published, so a git consumer needed a `[patch.crates-io]` table. The
# fork's branches name them by `path` or by revision, so it needs none:
# - rq/midnight-rs-ledger-9: the `ledger-9.1.0.0-rc.5` set, with zkir-v3 taken
#   from midnight-zkir 3.1.0-rc.1 (the IR that the pinned compactc emits), plus
#   the crates both generations share (base-crypto, serialize, storage,
#   storage-core, transient-crypto 2.2, zkir).
# - rq/midnight-rs-ledger-8: ledger 8.1.2, taking the shared crates from the
#   ledger 9 revision.
# The two generations share the crates listed under "Shared": a single
# instance serves both, so `AlignedValue`, `HashOutput`, `Sp` and the tagged
# codec are one Rust type across them. Cargo unifies a git crate only across
# identical URLs and revisions, so every entry spells both the same way.
#
# Pinning policy: every ledger crate below is pinned with `=` because they
# ship as one ABI-coupled release set (serialization formats and proof
# artifacts must match across the group). Bump them together, deliberately,
# in this order: the ledger 9 branch, the ledger 8 branch (it names the ledger
# 9 revision), the midnight-node branch (it names both), then the revisions
# here. Transitive midnight-* crates outside the fork (proofs, zk-stdlib, ...)
# still float on upstream caret requirements and are held only by Cargo.lock.
#
# The Compact side (interpreter, runtime, typed state, generated bindings)
# binds to ledger 9's on-chain runtime. The Impact ops and the state encoding
# are the same in both generations, so its values reach a ledger 8 chain by
# re-encoding.
midnight-onchain-runtime = { version = "=4.0.0", git = "https://github.com/RomarQ/midnight-ledger", rev = "425ef0c2f48fcbd188ee8324550b388e13160795" }
midnight-onchain-state = { version = "=4.0.0", git = "https://github.com/RomarQ/midnight-ledger", rev = "425ef0c2f48fcbd188ee8324550b388e13160795" }
midnight-transient-crypto = { version = "=3.0.0", git = "https://github.com/RomarQ/midnight-ledger", rev = "425ef0c2f48fcbd188ee8324550b388e13160795" }
midnight-coin-structure = { version = "=3.0.0", git = "https://github.com/RomarQ/midnight-ledger", rev = "425ef0c2f48fcbd188ee8324550b388e13160795" }
midnight-curves = { version = "=0.3.1" }
# Pinned with midnight-curves: its `CircuitField` impls are on those types.
midnight-circuits = { version = "=7.2.4" }
midnight-zkir-v3 = { version = "=3.1.0-rc.1", git = "https://github.com/RomarQ/midnight-ledger", rev = "425ef0c2f48fcbd188ee8324550b388e13160795" }
# Ledger 8's state types, to read state a ledger 8 chain wrote.
midnight-onchain-state-ledger-8 = { package = "midnight-onchain-state", version = "=3.0.1", git = "https://github.com/RomarQ/midnight-ledger", rev = "22f4651449e671e9f0fc2602be0109ec3a2b990f" }
midnight-coin-structure-ledger-8 = { package = "midnight-coin-structure", version = "=2.0.2", git = "https://github.com/RomarQ/midnight-ledger", rev = "22f4651449e671e9f0fc2602be0109ec3a2b990f" }
# Shared
midnight-serialize = { version = "=1.2.0", git = "https://github.com/RomarQ/midnight-ledger", rev = "425ef0c2f48fcbd188ee8324550b388e13160795" }
midnight-base-crypto = { version = "=1.1.0", git = "https://github.com/RomarQ/midnight-ledger", rev = "425ef0c2f48fcbd188ee8324550b388e13160795" }
midnight-storage = { version = "=2.0.4", git = "https://github.com/RomarQ/midnight-ledger", rev = "425ef0c2f48fcbd188ee8324550b388e13160795" }

# The ledger helpers of midnight-node: `midnight-ledger-unsafe-helpers` carries
# the per-generation type surface and the transaction and wallet builders, in a
# `ledger_8` and a `ledger_9` module. It comes from the RomarQ/midnight-node
# fork's rq/midnight-rs-toolkit-2.1.0-rc.3 branch, which is `toolkit-2.1.0-rc.3`
# with its ledger crates taken from the revisions above.
midnight-ledger-unsafe-helpers = { git = "https://github.com/RomarQ/midnight-node", rev = "ef1330ebbc9f7b7f7f3f3210a91bef2422b0d74f" }

